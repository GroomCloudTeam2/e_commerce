spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    user:
      name: user
      password: 1234


jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  access-token-validity: 3600000
  refresh-token-validity: 604800000

logging:
  level:
    root: ERROR
    com.groom.ecommerce: DEBUG
    org.hibernate.SQL: DEBUG

toss:
  payments:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
    client-key: test_ck_AQ92ymxN349xlKM196KKVajRKXvd
    success-url: http://localhost:8080/pay-success.html
    fail-url: http://localhost:8080/pay-fail.html
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

